<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/images/Alt 1.png" type=".png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preload" href="assets/fonts/baumans-v18-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/poiret-one-v18-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
    <title>Flowtech Business Card</title>
</head>
<body>
    <main class="card">
        <img class="logo" src="assets/images/Alt 1.png" alt="Logo of business" height="50" width="50">
        <h1 class="main-title">Flowtech Pumps</h1>
        <h2 class="sub-title">Efficiency in every drop</h2>

        <h3 class="alt-title">Borehole Pumps</h2>
        <h3 class="alt-title">Booster Systems</h2>
        <h3 class="alt-title">Wastewater</h2>

        <section class="info-component">

            <div class="info-container">
                <img class="icon" src="assets/images/user-regular-full.svg" alt="profile picture" height="25" width="25">
                <div class="info-content">
                    <p class="p-text">Fanelwa Nkumba</p>
                    <p class="p-text">Pump Solutions Specialist</p>
                </div>
            </div>
                
            <div class="info-container">
                <img class="icon" src="assets/images/phone-solid-full.svg" alt="" height="30" width="30"> 
                <div class="info-content">
                    <a class="links" href="tel:0692062218">+27692062218</a>
                </div>
            </div>

            <div class="info-container">
                <img class="icon" src="assets/images/envelope-regular-full (2).svg" alt="" height="30" width="30">
                <div class="info-content">
                    <a class="links" href="mailto::flowtechpumps.sa@gmail.com">flowtechpumps.sa@gmail.com</a>
                </div>
            </div>

            <div class="info-container">
                <img class="icon" src="assets/images/location-dot-solid-full.svg" alt="" height="30" width="30">
                <div class="info-content">
                    <p class="p-text">18 Waverley Road, Highlands North, Gresswold, Vaude</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
